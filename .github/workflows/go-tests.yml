name: go-tests

on:
  push:
    branches: [main]
    paths: ["go/**", ".github/workflows/go-tests.yml"]
  pull_request:
    paths: ["go/**", ".github/workflows/go-tests.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
