name: sdk-node-publish

# Builds + publishes the Node SDK to npm on a sdk-node-v* tag push.
#
# AUTH — two modes, same workflow, no edit needed to switch:
#   1. Trusted publishing (OIDC, the target). Configure it on npmjs.com:
#      @struct-x/sdk → Settings → Trusted Publisher → GitHub Actions:
#      org struct-x-ai, repo struct-x-sdks, workflow sdk-node-publish.yml,
#      environment npm, allowed action "npm publish" (dist-tag not needed).
#      npm 11.5.1+ then authenticates through the job's OIDC token and no
#      secret is used. Trusted publishing needs the package to exist, so it
#      can only be set up after the first publish.
#   2. NPM_TOKEN fallback (first publish only). A granular access token
#      (Read and write, scoped to @struct-x, bypass 2FA, short expiry) in
#      the `npm` environment's secrets. npm uses it only when no trusted
#      publisher is configured. Delete it once trusted publishing works:
#      npm removes direct publishing with granular tokens in January 2027.
#
# Node 24 ships npm 11 (trusted publishing needs npm >= 11.5.1); the
# "Check npm version" steps fail fast if a runner ever resolves older.
# --provenance attaches a signed provenance attestation (this repo is
# public, which npm requires for provenance).
#
# To cut a release:
#   1. Bump version in node/package.json AND node/src/version.ts
#      (must match — the test suite asserts the User-Agent string)
#   2. Update node/CHANGELOG.md
#   3. From the repo root:
#        git tag sdk-node-v0.2.0 -m "Release Node SDK 0.2.0"
#        git push origin sdk-node-v0.2.0
#
# The workflow also supports manual dispatch with a dry_run input for
# build-only verification without publishing.
#

on:
  push:
    tags:
      - "sdk-node-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, do not publish"
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 LTS (bundles npm 11). The package still supports
          # engines.node ">=18"; sdk-node-tests.yml covers older Nodes.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Check npm version
        # Trusted publishing (OIDC) needs npm >= 11.5.1.
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error("npm "+process.argv[1]+" < 11.5.1: trusted publishing needs a newer npm"); process.exit(1) }' "$(npm --version)"

      - name: Install dependencies
        # `npm ci` enforces a clean install against the lockfile —
        # catches drift between package.json and package-lock.json that
        # `npm install` would silently accept.
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (ESM + CJS + .d.ts)
        run: npm run build

      - name: Verify package contents
        # `npm pack --dry-run` enumerates exactly what would be uploaded
        # — surfaces missing files (LICENSE, README) and unintended
        # includes (.env, node_modules) before they reach npm.
        run: npm pack --dry-run

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: structx-sdk-node-dist
          path: node/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Only publish on real tag pushes, not manual dry runs.
    if: startsWith(github.ref, 'refs/tags/sdk-node-v')
    timeout-minutes: 5
    defaults:
      run:
        working-directory: node
    permissions:
      # `id-token: write` lets npm authenticate via trusted publishing
      # (OIDC) and sign the provenance attestation. Needed in both modes.
      id-token: write
      contents: read
    environment:
      name: npm
      url: https://www.npmjs.com/package/@struct-x/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Check npm version
        # Trusted publishing (OIDC) needs npm >= 11.5.1.
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error("npm "+process.argv[1]+" < 11.5.1: trusted publishing needs a newer npm"); process.exit(1) }' "$(npm --version)"

      - name: Install + build
        # Rebuilding here (rather than downloading the build artifact)
        # avoids any path-mangling that artifact upload + download can
        # introduce in the dist/ tree. ~30s extra; worth the determinism.
        run: |
          npm ci
          npm run build

      - name: Publish to npm
        # --access public makes the scoped @struct-x/sdk package
        # publicly installable (default for scoped packages is restricted).
        # --provenance attaches a signed provenance attestation that
        # consumers can check with `npm audit signatures`.
        # Auth: trusted publishing (OIDC) when configured on npmjs.com;
        # otherwise the NPM_TOKEN fallback below (empty once deleted).
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
